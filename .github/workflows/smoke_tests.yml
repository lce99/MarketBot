name: Smoke Tests

on:
  push:
  pull_request:

jobs:
  production-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Import collection and reporting entrypoints without running jobs
        run: python -c "import scripts.collect; import scripts.report; import src.collectors.vietnam_provider"

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-smoke.txt

      - name: Install dependencies
        run: pip install -r requirements-smoke.txt

      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
